
name: Build Vanadzor Taxi Park APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/vanadzortaxipark

          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'VanadzorTaxiPark'
          include ':app'" > settings.gradle

          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle

          echo "plugins { id 'com.android.application' }
          android {
            namespace 'com.vanadzortaxipark'
            compileSdk 35
            defaultConfig {
              applicationId 'com.vanadzortaxipark'
              minSdk 23
              targetSdk 28
              versionCode 1
              versionName '1.0'
            }
          }" > app/build.gradle

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Vanadzor Taxi Park">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/vanadzortaxipark/MainActivity.java <<'EOF'
          package com.vanadzortaxipark;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
            public void onCreate(Bundle b) {
              super.onCreate(b);
              LinearLayout l = new LinearLayout(this);
              l.setOrientation(1);
              l.setGravity(Gravity.CENTER);
              TextView t = new TextView(this);
              t.setText("VANADZOR TAXI PARK\n055 747573");
              t.setTextSize(26);
              l.addView(t);
              Button c = new Button(this);
              c.setText("ԶԱՆԳԱՀԱՐԵԼ ՏԱՔՍԻ");
              l.addView(c);
              c.setOnClickListener(v -> startActivity(new Intent(Intent.ACTION_DIAL, Uri.parse("tel:055747573"))));
              setContentView(l);
            }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vanadzor-Taxi-Park-APK
          path: app/build/outputs/apk/debug/app-debug.apk
