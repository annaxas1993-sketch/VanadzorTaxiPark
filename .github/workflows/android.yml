name: Build Vanadzor Taxi Park APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/vanadzortaxipark

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VanadzorTaxiPark"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vanadzortaxipark'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vanadzortaxipark'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Vanadzor Taxi Park">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/vanadzortaxipark/MainActivity.java <<'EOF'
          package com.vanadzortaxipark;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(28, 28, 28, 28);
                  layout.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("VANADZOR TAXI PARK");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  TextView phone = new TextView(this);
                  phone.setText("055 747573");
                  phone.setTextSize(24);
                  phone.setGravity(Gravity.CENTER);
                  phone.setPadding(0, 30, 0, 30);
                  layout.addView(phone);

                  Button call = new Button(this);
                  call.setText("ԶԱՆԳԱՀԱՐԵԼ ՏԱՔՍԻ");
                  layout.addView(call);

                  call.setOnClickListener(v -> {
                      Intent intent = new Intent(
                          Intent.ACTION_DIAL,
                          Uri.parse("tel:055747573")
                      );
                      startActivity(intent);
                  });

                  setContentView(layout);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vanadzor-Taxi-Park-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
